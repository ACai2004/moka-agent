spring:
  application:
    name: moka-agent

  datasource:
    url: jdbc:postgresql://localhost:5432/moka
    username: moka
    password: ${DB_PASSWORD:moka123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6380

server:
  port: 8080

moka:
  llm:
    mock: true

  openrouter:
    base-url: https://openrouter.ai/api/v1
    api-key: ${OPENROUTER_API_KEY}
    text-model: deepseek-v4
    vision-model: qwen3.6-plus
    embedding-model: text-embedding-3-small
