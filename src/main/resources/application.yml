spring:
  config:
    import: classpath:moka-workflow.yml
  application:
    name: moka-agent

  datasource:
    url: jdbc:postgresql://localhost:5432/moka
    username: moka
    password: ${DB_PASSWORD:moka123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6380

server:
  port: 8080

moka:
  llm:
    mock: true

  deepseek:
    api-key: ${DEEPSEEK_API_KEY}
    base-url: https://api.deepseek.com
    text-model: deepseek-v4-flash

  openrouter:
    api-key: ${OPENROUTER_API_KEY}
    base-url: https://openrouter.ai/api/v1
    vision-model: qwen3.6-plus

  gaode:
    api-key: ${GAODE_API_KEY}
    base-url: https://restapi.amap.com/v3
